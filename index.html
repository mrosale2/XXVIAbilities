const getOutputCount = (targetKey) => {
    return abilities.filter(a => {
        // Get all output keys across all groups (Output1, ALWAYS, etc.) for this ability
        const allKeys = Object.values(a.outputGroups || {}).flat();
        return allKeys.includes(targetKey);
    }).length;
};

        function getTriggerCounts() {
            const counts = {};
            abilities.forEach(a => {
                a.triggers.active.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
                a.triggers.deactive.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
            });
            return Object.entries(counts).sort((a, b) => a[1] - b[1]);
        }

        function getOutputCounts() {
            const counts = {};
            abilities.forEach(a => {
                Object.values(a.outputGroups).flat().forEach(k => { counts[k] = (counts[k] || 0) + 1; });
            });
            return Object.entries(counts).sort((a, b) => a[1] - b[1]);
        }

            const colors = { QB: "bg-red-100 text-red-700", WR: "bg-purple-100 text-purple-700", HB: "bg-amber-100 text-amber-700", TE: "bg-cyan-100 text-cyan-700", OL: "bg-gray-200 text-gray-700", DL: "bg-rose-100 text-rose-700", LB: "bg-orange-100 text-orange-700", DB: "bg-sky-100 text-sky-700", K: "bg-lime-100 text-lime-700", MULTI: "bg-indigo-100 text-indigo-700" };
            return colors[pos] || "bg-gray-100 text-gray-600";
        }

        function extractValues(desc) {
            const vals = [];
            const pctMatch = desc.match(/(\d+)%\s*chance/i);
            if (pctMatch) vals.push({ label: pctMatch[0], type: "chance" });
            const stamMatch = desc.match(/(\d+\.?\d*)\s*stamina/i);
            if (stamMatch) vals.push({ label: stamMatch[0], type: "stamina" });
            const yardMatch = desc.match(/\+(\d+)y\b/i);
            if (yardMatch) vals.push({ label: yardMatch[0], type: "yard" });
            const pctMod = desc.match(/(\d+)%\s*(more|increase|boost|reduction|reduces)/i);
            if (pctMod && !pctMatch) vals.push({ label: pctMod[0], type: "mod" });
            return vals;
        }

                }
            }

            if (view === 'matrix') {
                const selected = abilities.filter(a => compareIds.includes(a.id));
                const allAttributes = [...new Set(selected.flatMap(a => Object.values(a.outputGroups).flat()))];
                const allActivations = [...new Set(selected.flatMap(a => a.triggers.active))];
                const allDeactivations = [...new Set(selected.flatMap(a => a.triggers.deactive))];
                
                const matrixSearch = (window.matrixQuery || "").toLowerCase();
                const filterRow = (key) => (triggerLookup[key]?.l || outputLookup[key]?.l || key).toLowerCase().includes(matrixSearch);

                app.innerHTML = `
                    <div class="flex gap-3 items-center mb-4">
                        <button onclick="compareIds=[]; render('list')" class="text-gray-500 hover:text-gray-700 font-bold text-[14px] transition-colors">&larr; Exit</button>
                        <input type="text" id="matrix-inner-search" placeholder="Filter outputs & triggers..." value="${window.matrixQuery || ''}" class="flex-1 bg-white border-2 border-gray-200 px-4 py-2.5 rounded-xl text-[14px] font-medium outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all placeholder-gray-400 shadow-sm">
                    </div>
                    <div class="matrix-container custom-scroll flex-1">
                        <table class="matrix-table">
                            <tr style="background:#f8f9fb">
                                <th class="sticky-col text-[13px] font-bold text-gray-500 uppercase" style="background:#f8f9fb">Attribute</th>
                                ${selected.map(a => `<th class="check-col" style="background:#f8f9fb"><div class="header-cell-content"><img src="${iconPath}${a.img}" class="matrix-icon" onerror="this.src='https://placehold.co/28x28/f0f0f0/2563eb?text=?'"><div class="header-text-rotated">${a.name} ${a.category === 'xf' ? '<br><span class="text-orange-500 text-[11px] font-extrabold">XF</span>' : ''}</div></div></th>`).join('')}
                            </tr>
                            <tr><td colspan="${selected.length + 1}" class="section-divider">Outputs</td></tr>
                            ${allAttributes.filter(filterRow).map(key => `
    <tr>
        <td class="sticky-col cursor-pointer" onclick="filterTag='${key}'; filterType='output'; render('list')">
            <div class="text-[13px] accent-text font-bold">${outputLookup[key]?.l || key}</div>
            <div class="text-[12px] text-gray-400 font-medium leading-snug mt-0.5">${outputLookup[key]?.d || ''}</div>
        </td>
        ${selected.map(a => {
            const has = Object.values(a.outputGroups).flat().includes(key);
            return `<td class="check-col">${has ? '<span class="text-blue-600 font-bold">&#10003;</span>' : ''}</td>`;
        }).join('')}
    </tr>
`).join('')}
                            <tr><td colspan="${selected.length + 1}" class="section-divider">Activations</td></tr>
                            ${allActivations.filter(filterRow).map(key => `
    <tr>
        <td class="sticky-col cursor-pointer" onclick="filterTag='${key}'; filterType='trigger'; render('list')">
            <div class="text-[13px] text-emerald-600 font-bold">${triggerLookup[key]?.l || key}</div>
            <div class="text-[12px] text-gray-400 font-medium leading-snug mt-0.5">${triggerLookup[key]?.d || ''}</div>
        </td>
        ${selected.map(a => `<td class="check-col">${a.triggers.active.includes(key) ? '<span class="text-emerald-600 font-bold">&#10003;</span>' : ''}</td>`).join('')}
    </tr>
`).join('')}
                            <tr><td colspan="${selected.length + 1}" class="section-divider">Deactivations</td></tr>
                            ${allDeactivations.filter(filterRow).map(key => `
    <tr>
        <td class="sticky-col cursor-pointer" onclick="filterTag='${key}'; filterType='trigger'; render('list')">
            <div class="text-[13px] text-red-500 font-bold">${triggerLookup[key]?.l || key}</div>
            <div class="text-[12px] text-gray-400 font-medium leading-snug mt-0.5">${triggerLookup[key]?.d || ''}</div>
        </td>
        ${selected.map(a => `<td class="check-col">${a.triggers.deactive.includes(key) ? '<span class="text-red-500 font-bold">&#10003;</span>' : ''}</td>`).join('')}
    </tr>
`).join('')}
                        </table>
                    </div>`;

                const mSearch = document.getElementById('matrix-inner-search');
                if (document.activeElement !== mSearch && window.matrixQuery.length > 0) {
                    mSearch.focus();
                    mSearch.setSelectionRange(mSearch.value.length, mSearch.value.length);
                }
                mSearch.addEventListener('input', (e) => {
                    window.matrixQuery = e.target.value;
                    render('matrix');
                });
            }
        }

        function openPortal(currentId) { 
            compareIds = [currentId]; 
            window.portalSearchQuery = "";
            const overlay = document.createElement('div'); overlay.className = 'portal-overlay'; overlay.id = 'portal'; 
            document.body.appendChild(overlay); 
            refreshPortalUI(); 
        }
        
        function refreshPortalUI() {
            const portal = document.getElementById('portal');
            const searchQuery = (window.portalSearchQuery || "").toLowerCase();
            const filtered = abilities.filter(a => a.name.toLowerCase().includes(searchQuery));

            portal.innerHTML = `
                <div class="bg-white w-full max-w-md p-5 rounded-2xl shadow-2xl border border-gray-200">
                    <div class="mb-3">
                        <input type="text" id="portal-search" placeholder="Search abilities to compare..." value="${window.portalSearchQuery || ''}" class="w-full bg-gray-50 border-2 border-gray-200 px-4 py-2.5 rounded-xl text-[14px] font-medium outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all placeholder-gray-400">
                    </div>
                    <div class="space-y-1 mb-4 max-h-72 overflow-y-auto custom-scroll">
                        ${filtered.length === 0 ? '<div class="text-center text-gray-400 font-bold text-[14px] py-8">No matches</div>' : ''}
                        ${filtered.map(a => `
                            <div class="flex items-center justify-between px-3 py-2.5 hover:bg-gray-50 cursor-pointer rounded-lg transition-colors" onclick="toggleCompare('${a.id}'); refreshPortalUI()">
                                <div class="flex items-center gap-3">
                                    <img src="${iconPath}${a.img}" class="ability-icon" onerror="this.src='https://placehold.co/28x28/f0f0f0/2563eb?text=?'">
                                    <span class="font-semibold text-[14px]">${a.name} ${a.category === 'xf' ? '<span class="ml-1.5 text-orange-500 font-extrabold text-[12px] bg-orange-50 px-1.5 py-0.5 rounded">XF</span>' : ''}</span>
                                </div>
                                <input type="checkbox" ${compareIds.includes(a.id) ? 'checked' : ''} onchange="event.preventDefault()">
                            </div>`).join('')}
                    </div>
                    <div class="flex gap-3">
                        <button onclick="compareIds=[]; document.getElementById('portal').remove(); render('list')" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold text-[14px] rounded-xl transition-colors">Cancel</button>
                        <button onclick="document.getElementById('portal').remove(); render('matrix')" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-[14px] rounded-xl transition-colors shadow-lg shadow-blue-200">Compare (${compareIds.length})</button>
                    </div>
                </div>`;

            const pSearch = document.getElementById('portal-search');
            if (pSearch) {
                if (document.activeElement !== pSearch && window.portalSearchQuery.length > 0) {
                    pSearch.focus();
                    pSearch.setSelectionRange(pSearch.value.length, pSearch.value.length);
                }
                pSearch.addEventListener('input', (e) => {
                    window.portalSearchQuery = e.target.value;
                    refreshPortalUI();
                });
            }
        }

        setGlobalTab('reg');
    </script>
</body>
</html>
